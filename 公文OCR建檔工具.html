<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公文 OCR 建檔工具</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Figtree:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  /*
    Visual system taken from monday.com's "Vibe" design system
    (https://vibe.monday.com — Foundations / Colors, Typography, Spacing,
    Round Corners), read directly off its live token set. Same component
    library's spirit, rebuilt in plain CSS: no React/build step, this stays
    a single file you just open.
  */
  :root{
    --v-primary:#0073ea;
    --v-primary-hover:#0060b9;
    --v-primary-selected:#cce5ff;
    --v-primary-selected-hover:#aed4fc;
    --v-primary-surface:#eceff8;
    --v-primary-highlight:#f0f7ff;
    --v-text:#323338;
    --v-text-secondary:#676879;
    --v-border:#c3c6d4;
    --v-border-layout:#d0d4e4;
    --v-bg:#ffffff;
    --v-bg-grey:#f6f7fb;
    --v-bg-disabled:#ecedf5;
    --v-negative:#d83a52;
    --v-negative-selected:#f4c3cb;
    --v-positive:#00854d;
    --v-positive-selected:#bbdbc9;
    --v-warning-text:#8a6d00;
    --v-warning-selected:#fceba1;
    --v-indigo:#5559df;
    --v-indigo-selected:#aaacef;
    --v-link:#1f76c2;
    --v-shadow-xs:0 4px 6px -4px rgba(0,0,0,.12);
    --v-shadow-sm:0 4px 8px rgba(0,0,0,.16);
    --v-shadow-md:0 6px 20px rgba(0,0,0,.18);
    --v-radius-sm:4px;
    --v-radius-md:8px;
    --v-radius-lg:16px;
    --v-font-title:"Poppins","Noto Sans TC",sans-serif;
    --v-font-body:"Figtree","Noto Sans TC",sans-serif;
    --filter-h:38px;
    --v-mono:"SFMono-Regular",ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--v-bg-grey);
    color:var(--v-text);
    font-family:var(--v-font-body);
    font-size:14px;
    line-height:1.5;
    padding:32px 24px 80px;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px;margin:0 auto;}
  header{
    position:sticky; top:0; z-index:30;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:14px 0; margin:-32px 0 24px; flex-wrap:wrap;
    background:var(--v-bg-grey); border-bottom:1px solid var(--v-border-layout);
  }
  header h1{
    font-family:var(--v-font-title); font-size:1.5rem; margin:0; font-weight:600; letter-spacing:-.01em;
    color:var(--v-text); transition:font-size .15s;
  }
  header p{
    margin:4px 0 0; color:var(--v-text-secondary); font-size:.78rem; max-width:520px;
    overflow:hidden; max-height:40px; opacity:1; transition:max-height .15s, opacity .15s, margin .15s;
  }
  header.scrolled h1{ font-size:1.1rem; }
  header.scrolled p{ max-height:0; opacity:0; margin-top:0; }
  .stats{font-size:.8rem; color:var(--v-text-secondary); display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
  .stats b{color:var(--v-text); font-size:1.15rem; font-family:var(--v-font-title); font-weight:600;}

  #dropzone{
    border:1.5px dashed var(--v-border);
    border-radius:var(--v-radius-md);
    background:var(--v-bg);
    padding:36px 20px;
    text-align:center;
    cursor:pointer;
    transition:background .15s, border-color .15s;
    margin-bottom:20px;
  }
  #dropzone:hover{ border-color:var(--v-primary); background:var(--v-primary-highlight); }
  #dropzone.drag{ background:var(--v-primary-highlight); border-color:var(--v-primary); }
  #dropzone .icon{ color:var(--v-text-secondary); margin-bottom:8px; }
  #dropzone .icon svg{ width:32px; height:32px; }
  #dropzone p{margin:2px 0; color:var(--v-text-secondary); font-size:.85rem;}
  #dropzone .main-line{color:var(--v-text); font-size:1rem; font-weight:600; margin-bottom:4px;}
  #fileInput{display:none;}

  #engineStatus{
    font-size:.78rem; color:var(--v-text-secondary); margin:-10px 0 18px; text-align:center;
    font-family:var(--v-mono);
  }

  .link-btn{
    font-family:inherit; font-size:.8rem; color:var(--v-link); background:none; border:none; padding:4px 2px;
    cursor:pointer;
  }
  .link-btn:hover{ text-decoration:underline; }
  .filter-summary{
    display:flex; align-items:center; gap:6px; flex-wrap:wrap; min-height:24px;
    font-size:.78rem; color:var(--v-text-secondary);
  }
  .filter-summary .fs-chip{
    max-width:320px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    background:var(--v-primary-selected); color:var(--v-primary-hover); font-weight:600;
    padding:2px 9px; border-radius:12px; line-height:1.6;
  }
  .filter-summary .fs-count{ margin-left:auto; white-space:nowrap; }
  .count-pill{
    font-size:.78rem; color:var(--v-text-secondary); white-space:nowrap;
  }

  .filters{
    display:flex; flex-direction:column; gap:10px; margin-bottom:20px;
  }
  .filters-search{
    width:100%; padding:9px 14px; border:1px solid var(--v-border); border-radius:var(--v-radius-sm);
    background:var(--v-bg); color:var(--v-text); font-family:inherit; font-size:.88rem;
    transition:border-color .1s, box-shadow .1s;
  }
  .filters-search:focus{ outline:none; border-color:var(--v-primary); box-shadow:0 0 0 2px var(--v-primary-selected); }
  .filters-row{
    display:flex; gap:8px; align-items:center; flex-wrap:wrap;
  }

  .multiselect{ position:relative; }
  .multiselect-btn{
    font-family:inherit; font-size:.82rem; color:var(--v-text); background:var(--v-bg);
    border:1px solid var(--v-border); border-radius:var(--v-radius-sm); padding:8px 12px; cursor:pointer; white-space:nowrap;
    transition:border-color .1s, background .1s;
  }
  .multiselect-btn{ display:inline-flex; align-items:center; gap:6px; height:var(--filter-h); }
  .multiselect-btn .chevron{ width:12px; height:12px; flex:none; transition:transform .15s; }
  .multiselect.open .multiselect-btn .chevron{ transform:rotate(180deg); }
  .multiselect-btn:hover{ border-color:var(--v-primary); background:var(--v-primary-highlight); }
  .multiselect-btn.has-selection{ border-color:var(--v-primary); color:var(--v-primary); background:var(--v-primary-highlight); font-weight:600; }
  .multiselect-panel{
    position:absolute; top:calc(100% + 4px); left:0; z-index:20; min-width:240px; max-width:320px;
    max-height:280px; overflow-y:auto; background:var(--v-bg); border:1px solid var(--v-border);
    border-radius:var(--v-radius-sm); padding:8px; box-shadow:var(--v-shadow-md);
  }
  .multiselect-panel label{
    display:flex; align-items:center; gap:8px; padding:7px 8px; font-size:.83rem; border-radius:var(--v-radius-sm); cursor:pointer;
  }
  .multiselect-panel label:hover{ background:var(--v-bg-grey); }
  .multiselect-panel .empty-hint{ padding:8px 6px; font-size:.8rem; color:var(--v-text-secondary); }
  .multiselect-panel .ms-search{
    position:sticky; top:-8px; z-index:1; width:100%; margin:-8px 0 6px; padding:9px 10px;
    border:none; border-bottom:1px solid var(--v-border-layout); background:var(--v-bg); color:var(--v-text);
    font-family:inherit; font-size:.83rem; border-radius:var(--v-radius-sm) var(--v-radius-sm) 0 0;
  }
  .multiselect-panel .ms-search:focus{ outline:none; border-bottom-color:var(--v-primary); }
  .multiselect-panel .ms-actions{
    display:flex; justify-content:space-between; padding:4px 6px 8px; border-bottom:1px solid var(--v-border-layout); margin-bottom:6px;
  }
  .multiselect-panel .ms-actions button{
    font-family:inherit; font-size:.72rem; font-weight:600; color:var(--v-primary); background:none; border:none; cursor:pointer; padding:0;
  }

  .date-range{ display:flex; align-items:center; gap:6px; font-size:.8rem; color:var(--v-text-secondary); flex-wrap:wrap; }
  .date-range input[type=date]{
    height:var(--filter-h);
    padding:7px 9px; border:1px solid var(--v-border); background:var(--v-bg); color:var(--v-text);
    border-radius:var(--v-radius-sm); font-family:inherit; font-size:.82rem;
  }
  .date-range input[type=date]:focus{ outline:none; border-color:var(--v-primary); box-shadow:0 0 0 2px var(--v-primary-selected); }

  table{width:100%; border-collapse:collapse; background:var(--v-bg); font-size:.85rem; margin-top:16px; border-radius:var(--v-radius-md); overflow:hidden; box-shadow:var(--v-shadow-xs);}
  thead th{
    text-align:left; font-size:.72rem; letter-spacing:.03em; color:var(--v-text-secondary); text-transform:uppercase;
    background:var(--v-bg-grey); border-bottom:1px solid var(--v-border-layout); padding:10px 12px; font-weight:600; white-space:nowrap;
  }
  thead th.sortable{ cursor:pointer; user-select:none; }
  thead th.sortable:hover{ color:var(--v-primary); }
  thead th.sortable .sort-arrows{
    display:inline-flex; flex-direction:column; vertical-align:middle; margin-left:4px; gap:1px; line-height:0;
  }
  thead th.sortable .sort-arrows svg{ width:8px; height:8px; display:block; }
  thead th.sortable .sort-arrows .sa-up,
  thead th.sortable .sort-arrows .sa-down{ color:var(--v-text-secondary); opacity:.4; }
  thead th.sortable.sort-active .sort-arrows .sa-up.active,
  thead th.sortable.sort-active .sort-arrows .sa-down.active{ color:var(--v-primary); opacity:1; }
  tbody td{ padding:12px; border-bottom:1px solid var(--v-border-layout); vertical-align:top; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background:var(--v-bg-grey); }
  .filename{font-weight:600; font-size:.85rem;}
  .subtitle-cell{ max-width:280px; }
  .subtitle-cell .clamp{
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
    color:var(--v-text); line-height:1.45;
  }
  .muted{color:var(--v-text-secondary);}

  .chip{
    display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:12px;
    font-size:.68rem; font-weight:600; white-space:nowrap; line-height:1.7;
  }
  .chip .chip-icon{ width:11px; height:11px; flex:none; }
  .chip.tone-unknown{ background:var(--v-bg-disabled); color:var(--v-text-secondary); }
  .chip.tone-local{ background:var(--v-bg-disabled); color:var(--v-text-secondary); }
  .chip.tone-gemini{ background:var(--v-indigo-selected); color:var(--v-indigo); }
  .chip.tone-processing{ background:var(--v-warning-selected); color:var(--v-warning-text); }
  .chip.tone-error{ background:var(--v-negative-selected); color:var(--v-negative); }
  .row-tags{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:5px; }

  .checkbox-cell{ width:36px; padding-right:0 !important; }
  .row-checkbox, .select-all-checkbox{ width:16px; height:16px; cursor:pointer; accent-color:var(--v-primary); vertical-align:middle; }
  tbody tr.row-selected{ background:var(--v-primary-highlight); }
  tbody tr.row-selected:hover{ background:var(--v-primary-selected); }

  /* Same flex layout as .filters-row on purpose — this bar swaps in for
     that row when something's selected, so matching its shape (not just
     roughly its height) keeps the table from jumping when they trade places.
     Both rows stay stacked in the same grid cell (rather than one being
     display:none) so the swap can crossfade instead of hard-cutting — and
     since neither is ever actually removed from flow, the grid track's
     height never has to jump to accommodate just one of them. */
  .filter-slot{ display:grid; }
  .filter-slot > *{ grid-area:1 / 1; }
  .filters-row, .bulk-action-bar{
    display:flex; gap:8px; align-items:center; flex-wrap:wrap; min-height:var(--filter-h);
    opacity:1; transform:translateY(0); visibility:visible;
    transition:opacity .16s ease, transform .16s ease;
  }
  .filters-row.slot-hidden, .bulk-action-bar.slot-hidden{
    opacity:0; transform:translateY(-4px); visibility:hidden; pointer-events:none;
    transition:opacity .16s ease, transform .16s ease, visibility 0s linear .16s;
  }
  .bulk-action-bar .bulk-count{
    font-size:.78rem; font-weight:600; color:var(--v-primary);
    background:var(--v-primary-selected); padding:6px 10px; border-radius:var(--v-radius-sm); white-space:nowrap;
  }
  .bulk-action-bar .bulk-spacer{ flex:1; }

  .actions{ display:flex; align-items:center; gap:6px; flex-wrap:nowrap; }
  .icon-actions{ display:flex; align-items:center; gap:2px; margin-left:auto; }
  .icon-btn{
    display:inline-flex; align-items:center; justify-content:center;
    width:30px; height:30px; flex:none; padding:0; border:none; background:transparent;
    color:var(--v-text-secondary); cursor:pointer; border-radius:var(--v-radius-sm);
    transition:background .1s, color .1s;
  }
  /* Inside a flex row, a bare inline <svg> is a replaced element with no
     intrinsic size of its own — under space pressure flexbox can shrink it
     straight to 0 even with an explicit width set, unlike text content.
     flex:none plus min-width/min-height pins its box so it never collapses. */
  .icon-btn svg{ width:16px; height:16px; min-width:16px; min-height:16px; flex:none; }
  .icon-btn:hover{ background:var(--v-bg-grey); color:var(--v-primary); }
  .icon-btn.danger:hover{ background:var(--v-negative-selected); color:var(--v-negative); }
  .icon-btn:disabled{ opacity:.35; cursor:not-allowed; }
  .icon-btn:disabled:hover{ background:transparent; color:var(--v-text-secondary); }
  button.act{
    font-family:inherit; font-size:.75rem; font-weight:600; border:1px solid var(--v-border); background:var(--v-bg);
    color:var(--v-text); padding:6px 10px; border-radius:var(--v-radius-sm); cursor:pointer;
    transition:border-color .1s, background .1s, color .1s;
  }
  button.act:hover{ border-color:var(--v-primary); color:var(--v-primary); background:var(--v-primary-highlight); }
  button.act.saved{ border-color:var(--v-positive); color:var(--v-positive); background:var(--v-positive-selected); }
  button.act.danger:hover{ border-color:var(--v-negative); color:var(--v-negative); background:var(--v-negative-selected); }
  button.act:disabled{ opacity:.4; cursor:not-allowed; }
  button.act:disabled:hover{ border-color:var(--v-border); color:var(--v-text); background:var(--v-bg); }

  .empty-state{ text-align:center; padding:50px 20px; color:var(--v-text-secondary); font-size:.9rem; }

  /* unified detail dialog: PDF preview left, content (view or edit) right */
  .meta-grid{
    display:grid; grid-template-columns:110px 1fr; gap:10px 14px; font-size:.85rem; margin-bottom:20px;
  }
  .meta-grid dt{ color:var(--v-text-secondary); font-weight:600; }
  .meta-grid dd{ margin:0; }
  .fulltext-block{
    white-space:pre-wrap; font-family:var(--v-mono); font-size:.78rem; background:var(--v-bg-grey);
    border:1px solid var(--v-border-layout); border-radius:var(--v-radius-sm); padding:14px; max-height:340px; overflow-y:auto; line-height:1.6;
  }
  .modal-actions{ display:flex; align-items:center; justify-content:flex-end; gap:8px; flex-shrink:0; }
  .modal-actions button{ flex-shrink:0; }
  .modal-actions button:not(.icon-btn){
    font-family:inherit; font-weight:600; padding:9px 18px; border-radius:var(--v-radius-sm); font-size:.85rem; cursor:pointer;
    transition:background .1s, border-color .1s;
  }
  .btn-primary{ background:var(--v-primary); color:#fff; border:1px solid var(--v-primary); }
  .btn-primary:hover{ background:var(--v-primary-hover); border-color:var(--v-primary-hover); }
  .btn-secondary{ background:transparent; color:var(--v-text); border:1px solid var(--v-border); }
  .btn-secondary:hover{ border-color:var(--v-primary); color:var(--v-primary); }
  .btn-secondary.btn-danger:hover{ border-color:var(--v-negative); color:var(--v-negative); background:var(--v-negative-selected); }

  #importOverlay{
    position:fixed; inset:0; background:rgba(41,47,76,.55); display:none;
    align-items:flex-start; justify-content:center; padding:40px 16px; z-index:55; overflow-y:auto;
  }
  #importOverlay.show{ display:flex; }
  #importModal{
    background:var(--v-bg); max-width:640px; width:100%; border-radius:var(--v-radius-md);
    border:1px solid var(--v-border-layout); box-shadow:var(--v-shadow-md); padding:22px 24px; margin-bottom:40px;
  }
  #importModal .edit-modal-header{ margin-bottom:18px; }
  #importModal #dropzone{ margin-bottom:12px; }

  #exportConfirmOverlay{
    position:fixed; inset:0; background:rgba(41,47,76,.55); display:none;
    align-items:center; justify-content:center; padding:24px 16px; z-index:60;
  }
  #exportConfirmOverlay.show{ display:flex; }
  #exportConfirmModal{
    background:var(--v-bg); max-width:420px; width:100%; border-radius:var(--v-radius-md);
    border:1px solid var(--v-border-layout); box-shadow:var(--v-shadow-md); padding:22px 24px;
  }
  #exportConfirmModal h2{ font-family:var(--v-font-title); margin:0 0 10px; font-size:1.15rem; font-weight:600; }
  #exportConfirmModal p{ margin:0 0 20px; line-height:1.6; }

  .ocr-mode-picker{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
  .ocr-mode-option{ cursor:pointer; }
  .ocr-mode-option input{ position:absolute; opacity:0; width:0; height:0; }
  .ocr-mode-card{
    display:block; border:1.5px solid var(--v-border); border-radius:var(--v-radius-md); padding:12px 14px;
    transition:border-color .1s, background .1s;
  }
  .ocr-mode-option:hover .ocr-mode-card{ border-color:var(--v-primary); }
  .ocr-mode-option input:checked + .ocr-mode-card{
    border-color:var(--v-primary); background:var(--v-primary-highlight);
    box-shadow:0 0 0 1px var(--v-primary);
  }
  .ocr-mode-title{ display:flex; align-items:center; gap:7px; font-weight:600; font-size:.88rem; margin-bottom:4px; }
  .ocr-mode-icon{ width:16px; height:16px; flex:none; color:var(--v-text-secondary); }
  .ocr-mode-option input:checked + .ocr-mode-card .ocr-mode-icon{ color:var(--v-primary); }
  .ocr-mode-desc{ display:block; font-size:.76rem; color:var(--v-text-secondary); line-height:1.5; }

  .gemini-key-row{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:14px;
    padding:10px 12px; background:var(--v-bg-grey); border:1px solid var(--v-border-layout); border-radius:var(--v-radius-sm);
  }
  .gemini-key-row[hidden]{ display:none; }
  .gemini-key-row input[type=password], .gemini-key-row input[type=text]{
    padding:7px 10px; border:1px solid var(--v-border); background:var(--v-bg); color:var(--v-text);
    border-radius:var(--v-radius-sm); font-family:inherit; font-size:.82rem;
  }
  #geminiApiKeyInput{ flex:1; min-width:180px; }
  .gemini-model-input{ width:220px; font-family:var(--v-mono); font-size:.76rem !important; }
  select.gemini-model-input{ font-family:inherit; cursor:pointer; }
  .gemini-key-hint{ width:100%; font-size:.72rem; color:var(--v-text-secondary); line-height:1.5; }
  .gemini-key-hint a{ color:var(--v-link); }

  #detailOverlay{
    position:fixed; inset:0; background:rgba(41,47,76,.55); display:none;
    align-items:center; justify-content:center; padding:24px 16px; z-index:55;
  }
  #detailOverlay.show{ display:flex; }
  #detailModal{
    background:var(--v-bg); max-width:1180px; width:100%; height:100%; max-height:88vh;
    border-radius:var(--v-radius-md); border:1px solid var(--v-border-layout); box-shadow:var(--v-shadow-md); padding:22px 24px;
    display:flex; flex-direction:column;
  }
  .edit-modal-header{
    display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap;
    margin-bottom:14px; flex-shrink:0;
  }
  .edit-modal-header h2{ font-family:var(--v-font-title); margin:0 0 4px; font-size:1.15rem; font-weight:600; word-break:break-all; }
  .edit-modal-body{
    display:flex; gap:20px; flex:1; min-height:0;
  }
  .edit-preview-pane{
    flex:1.1; min-width:0; border:1px solid var(--v-border-layout); border-radius:var(--v-radius-sm); overflow:hidden; background:var(--v-bg-grey);
  }
  .edit-preview-pane iframe{ width:100%; height:100%; border:none; }
  .edit-form-pane{ flex:1; min-width:0; overflow-y:auto; padding-right:6px; }
  .edit-grid{
    display:grid; grid-template-columns:100px 1fr; gap:10px 14px; align-items:start;
  }
  .edit-grid label{ font-size:.8rem; color:var(--v-text-secondary); padding-top:8px; }
  .edit-grid input, .edit-grid select, .edit-grid textarea{
    width:100%; padding:7px 10px; border:1px solid var(--v-border); background:var(--v-bg);
    color:var(--v-text); border-radius:var(--v-radius-sm); font-family:inherit; font-size:.85rem; resize:vertical;
  }
  .edit-grid input:focus, .edit-grid select:focus, .edit-grid textarea:focus{
    outline:none; border-color:var(--v-primary); box-shadow:0 0 0 2px var(--v-primary-selected);
  }
  @media (max-width:900px){

  }
</style>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const DB_NAME = "gov-doc-ocr";
const STORE = "documents";

function openDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE, { keyPath: "id" });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function dbPut(record){
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, "readwrite");
    tx.objectStore(STORE).put(record);
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
}
async function dbGetAll(){
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, "readonly");
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function dbDelete(id){
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, "readwrite");
    tx.objectStore(STORE).delete(id);
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
}
let records = [];
let worker = null;
let workerReady = false;

// 發文字號裡的「簽第」是判斷文別＝簽（內部簽呈）最可靠的訊號，跟機關是
// 誰無關，純粹是公文程式條例的格式慣例，所以留著給 extractMetadata() 判斷
// 文別用。
const IS_INTERNAL_MEMO_RE = /簽第/;

// Same two icons as the import dialog's mode picker, reused here so the
// table chip reads as "the same thing, smaller" rather than a different symbol.
const OCR_METHOD_ICON = {
  local: '<svg class="chip-icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="2.5" y="3.5" width="15" height="10" rx="1.2" stroke="currentColor" stroke-width="1.6"/><path d="M7 17H13M10 13.5V17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
  gemini: '<svg class="chip-icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6.5 15H14A3 3 0 0 0 14.5 9.06 4 4 0 0 0 6.7 7.2 3.2 3.2 0 0 0 6.5 15Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>',
};

async function getWorker(){
  if (workerReady) return worker;
  const statusEl = document.getElementById("engineStatus");
  statusEl.textContent = "首次使用需下載中文 OCR 語言模型，請稍候…";
  worker = await Tesseract.createWorker("chi_tra+eng", 1, {
    logger: (m) => {
      if (m.status && typeof m.progress === "number") {
        statusEl.textContent = `OCR 引擎：${m.status}（${Math.round(m.progress * 100)}%）`;
      }
    },
  });
  workerReady = true;
  statusEl.textContent = "OCR 引擎已就緒";
  setTimeout(() => { if (workerReady) statusEl.textContent = ""; }, 2500);
  return worker;
}

async function renderPdfPages(arrayBuffer){
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  const canvases = [];
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const viewport = page.getViewport({ scale: 2.2 });
    const canvas = document.createElement("canvas");
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    const ctx = canvas.getContext("2d");
    await page.render({ canvasContext: ctx, viewport }).promise;
    canvases.push(canvas);
  }
  return canvases;
}

// --- 公文 metadata extraction -------------------------------------------------
// Tesseract's Traditional-Chinese model commonly inserts a space between every
// CJK glyph (and around adjacent digits/punctuation). Collapse that back down
// before any label matching, and drop lines the engine duplicated (a frequent
// artifact on boxed form headers) so a label doesn't swallow its own repeat.
function cleanOcrText(raw){
  let t = (raw || "").replace(/\r/g, "");
  t = t.replace(/[ \t]*\n[ \t]*/g, "\n");
  // strip whitespace touching a CJK character on either side
  for (let i = 0; i < 3; i++) {
    t = t.replace(/([一-鿿豈-﫿])[ \t]+/g, "$1");
    t = t.replace(/[ \t]+([一-鿿豈-﫿])/g, "$1");
  }
  t = t.replace(/[ \t]{2,}/g, " ");
  // collapse an immediately repeated "label:" line (OCR double-reads boxed headers)
  t = t.replace(/([一-鿿]{2,10}[:：])\n\1/g, "$1");
  return t.replace(/\n{3,}/g, "\n\n").trim();
}

// Fields are matched only at the START of a (trimmed) line, then a field's
// value keeps absorbing following lines until the next recognized label.
// This is what makes it safe for a label word to reappear mid-sentence
// elsewhere in the document (e.g. "附件：如說明" or "...擬具修正說明,")
// without being mistaken for the actual "說明" section header.
const FIELD_DEFS = [
  ["docNumber", /^(?:發文字號|字\s*號)[:：]?\s*/],
  ["docDate", /^(?:發文日期)[:：]?\s*/],
  ["speed", /^(?:速別)[:：]?\s*/],
  // "期限" is a single trailing-ish glyph run inside a longer label, exactly
  // the kind of thing OCR misreads (seen as "期腿") — without the wildcard
  // tail, a misread there falls back to matching just "密等" and leaves
  // "及解密條件或保密期X:" stuck onto the front of the captured value.
  ["security", /^密等(?:及解密條件或保密期.{0,2})?[:：]?\s*/],
  // An attachment divider page is often titled "附件一：<real title>" —
  // strip the optional numbering too, so the captured value is just the title.
  ["attachment", /^附件[一二三四五六七八九十0-9]*[:：]?\s*/],
  ["recipient", /^(?:受文者)[:：]?\s*/],
  ["subject", /^(?:主旨|案由)[:：]?\s*/],
  ["explanation", /^(?:說明)[:：]?\s*/],
  ["proposal", /^(?:擬辦(?:事項)?)[:：]?\s*/],
];
// Lines starting with these end whatever field was open, without becoming a
// captured field themselves (so e.g. 正本/副本 don't get absorbed into 說明).
const TERMINAL_RE = /^(?:正本|副本|承辦人|會辦|批示|檔號|保存年限|地址|聯絡人|聯絡方式|電話|電子郵件|機關全銜|上呈|敬陳|第\s*\d+\s*頁)/;
// A short field (附件, 主旨, 速別…) should never run past the page it started
// on — a page break almost always means "the attached document's own text
// starts here", not "this field continues". 說明/擬辦 are the exception:
// long documents routinely wrap those across pages.
const PAGE_BREAK = "␀PAGE␀";
const CONTINUES_ACROSS_PAGES = new Set(["explanation", "proposal"]);
// These are always a single line in a real 公文 — locking them the instant
// they're captured stops a stray line right after from bleeding in when
// OCR misreads the NEXT label (e.g. "速別" → "加別" isn't recognized as a
// label, so without the lock it silently gets appended onto 發文字號).
const SINGLE_LINE_FIELDS = new Set(["docNumber", "docDate", "speed", "security", "recipient"]);

function parseFields(norm){
  const lines = norm.split("\n").map(l => l.trim()).filter(l => l.length);
  const out = {};
  let current = null;
  for (const line of lines) {
    if (line === PAGE_BREAK) {
      if (current && !CONTINUES_ACROSS_PAGES.has(current)) current = null;
      continue;
    }
    const hit = FIELD_DEFS.find(([, re]) => re.test(line));
    if (hit) {
      const [key, re] = hit;
      // A label line always starts (or restarts) that field — it never
      // appends to a value already captured. This matters for e.g. 附件:
      // the cover letter often just says "附件：如說明" while an actual
      // attachment divider page later reads "附件一：<real title>"; without
      // this, the two would get glued into "如說明 一：<real title>"
      // instead of the second, more specific occurrence simply replacing
      // the placeholder.
      current = SINGLE_LINE_FIELDS.has(key) ? null : key;
      out[key] = line.replace(re, "");
      continue;
    }
    if (TERMINAL_RE.test(line)) { current = null; continue; }
    if (current) out[current] = (out[current] || "") + " " + line;
  }
  for (const k in out) out[k] = out[k].replace(/\s+/g, " ").trim();
  return out;
}

const AGENCY_SUFFIX = "(局|處|府|署|部|委員會|科|室|中心|管理處|事務所|公所|公司|行|學校|國小|國中|高中)";
const AGENCY_SUFFIX_RE = new RegExp(AGENCY_SUFFIX + "$");

// The 發文機關/公司 name is reliably the visually largest line near the top
// of page 1 (the letterhead) — Tesseract's line-level bbox data lets us find
// it by height instead of by text pattern, which is what actually breaks:
// small metadata (檔號, 保存年限…) is ~21-28px tall, the letterhead is
// consistently ~40px, a gap wide enough that a height threshold is reliable
// even when OCR misreads characters within the line.
function findTitleLineIndex(lines, pageHeight){
  if (!lines || !lines.length) return -1;
  const heights = lines.map(l => l.bbox.y1 - l.bbox.y0);
  const sorted = [...heights].sort((a, b) => a - b);
  const median = sorted[Math.floor(sorted.length / 2)] || 1;
  const topRegion = lines
    .map((l, idx) => ({ idx, h: l.bbox.y1 - l.bbox.y0, y0: l.bbox.y0 }))
    .filter(l => l.y0 < pageHeight * 0.4);
  if (!topRegion.length) return -1;
  topRegion.sort((a, b) => b.h - a.h);
  return topRegion[0].h >= median * 1.3 ? topRegion[0].idx : -1;
}

// The letterhead line's trailing 函/簽/書函/… marker is exactly the kind of
// single distinctive glyph OCR most often mis-reads (seen misread as "數"
// in practice) — stripping the known marker first, and otherwise trying
// "drop the last character", recovers the agency name either way.
// Rather than trying to strip a trailing 函/簽/公告/… marker (and OCR noise
// around it — a stray quote-like glyph, or the marker itself misread into
// an unrelated character like "銷" or "數"), find the LAST place in the
// line an agency-type suffix occurs and cut there. The trailing doc-type
// marker always comes after the real agency name, so whatever garbage
// trails it is simply discarded — this doesn't depend on recognizing what
// that garbage looks like, only on where the agency name itself ends.
function extractAgencyFromTitleLine(titleLineRaw){
  if (!titleLineRaw) return "";
  const original = cleanOcrText(titleLineRaw).replace(/\n/g, "").trim();
  if (!original) return "";
  const matches = [...original.matchAll(new RegExp(AGENCY_SUFFIX, "g"))];
  const last = matches[matches.length - 1];
  if (last) {
    const cut = original.slice(0, last.index + last[0].length);
    if (cut.length >= 3) return cut;
  }
  return original;
}

// "如說明" / "詳如說明" etc. is a placeholder meaning "see the 說明 section"
// — it's not the attachment's actual title, just a pointer to prose that
// often doesn't spell the title out either (as in the 附件檢附…一份 case).
const ATTACHMENT_PLACEHOLDER_RE = /^(如說明|詳如說明|如上|如附|如附件|如上開說明)$/;

function extractMetadata(rawText, titleLineRaw, pageTitleLines){
  const norm = cleanOcrText(rawText);
  const headerLines = norm.split("\n").map(l => l.trim()).filter(Boolean).slice(0, 8);

  const fields = parseFields(norm);
  const docNumber = fields.docNumber
    || (norm.match(/[一-鿿]{1,10}(?:字|簽)第[0-9０-９]+號/) || [""])[0];
  const docDate = fields.docDate
    || (norm.match(/中華民國\s*[0-9０-９一二三四五六七八九十]{1,3}\s*年\s*[0-9０-９一二三四五六七八九十]{1,3}\s*月\s*[0-9０-９一二三四五六七八九十]{1,3}\s*日?/) || [""])[0];

  // Doc-type is normally read off the trailing 函/簽/公告/… marker on the
  // letterhead line — but that single glyph is exactly what OCR most often
  // misreads (seen turning into "范", "數", "銷"...). 發文字號 is far more
  // reliable: it always literally spells out "字第" or "簽第" right next to
  // a run of digits, a context OCR handles consistently, so check that
  // first and only fall back to the letterhead/body-text heuristics when
  // the number didn't come through.
  // 公文程式條例 recognizes 令/呈/咨/函/公告 as the five formal types, plus a
  // long tail of "其他公文" sub-types (書函、開會通知單、公務電話紀錄、手令、
  // 簽…). Of that tail, only 簽/書函/開會通知單 actually turn up in this
  // office's real correspondence, so those three get their own docType value
  // — everything else in the tail (手令、箋函…) still falls into the generic
  // "其他公文" bucket. 簽 is checked first and via multiple signals since a
  // single trailing glyph is exactly what OCR misreads most often.
  const docType =
    IS_INTERNAL_MEMO_RE.test(docNumber) || headerLines.some(l => /簽$/.test(l)) || /^擬辦/m.test(norm) ? "簽" :
    headerLines.some(l => /開會通知單$/.test(l)) ? "開會通知單" :
    headerLines.some(l => /書函$/.test(l)) ? "書函" :
    headerLines.some(l => /(手令|手諭|箋函)$/.test(l)) ? "其他公文" :
    headerLines.some(l => /咨$/.test(l)) ? "咨" :
    headerLines.some(l => /呈$/.test(l)) ? "呈" :
    headerLines.some(l => /令$/.test(l)) ? "令" :
    headerLines.some(l => /公告$/.test(l)) ? "公告" :
    "函";

  // Prefer the bbox-detected letterhead line when we have one (new OCR
  // runs); fall back to the old text-only heuristic for records OCR'd
  // before this line-height data was captured.
  const agencyLine = extractAgencyFromTitleLine(titleLineRaw) || (
    headerLines
      .filter(l => !FIELD_DEFS.some(([, re]) => re.test(l)) && !TERMINAL_RE.test(l))
      .map(l => l.replace(/\s*(令|呈|咨|函|簽|書函|公告|開會通知單)\s*$/, "").trim())
      .find(l => AGENCY_SUFFIX_RE.test(l) && l.length >= 3 && l.length <= 20)
  ) || "";

  // 密等及解密條件或保密期限 is filled in as one line, e.g. "密，草案核備
  // 後解除" — the level (密/機密/極機密/絕對機密) and the declassify
  // condition are two distinct pieces of information, split on the comma
  // that separates them in the source document.
  const securityParts = (fields.security || "").split(/[,，]/).map(s => s.trim());
  const security = securityParts[0] || "";
  const declassifyCondition = securityParts.slice(1).join(",").trim();

  // If the cover letter only pointed at "如說明" and never named the
  // attachment, the attached document's own title (found the same way as
  // the letterhead — the visually oversized line near the top of whichever
  // later page it starts on) is a much more useful answer than the literal
  // placeholder text.
  let attachment = (fields.attachment || "").trim();
  if ((!attachment || ATTACHMENT_PLACEHOLDER_RE.test(attachment.replace(/\s+/g, ""))) && Array.isArray(pageTitleLines)) {
    for (const raw of pageTitleLines.slice(1)) {
      const candidate = cleanOcrText(raw || "").replace(/\n/g, "").trim();
      if (candidate.length >= 4 && candidate.length <= 60) { attachment = candidate; break; }
    }
  }

  return {
    docType, agency: agencyLine, docNumber, docDate,
    speed: fields.speed || "", security, declassifyCondition,
    attachment, recipient: fields.recipient || "",
    subject: fields.subject || "",
    explanation: fields.explanation || "", proposal: fields.proposal || "",
  };
}

// --- pipeline -------------------------------------------------------------
async function runOcrPipeline(record, fileBlob){
  try {
    const buf = await fileBlob.arrayBuffer();
    const canvases = await renderPdfPages(buf);
    record.pageCount = canvases.length;
    const w = await getWorker();
    let fullText = "";
    let titleLineRaw = "";
    // The same "line-height stands out from the page's body text" signal
    // that finds the letterhead on page 1 also finds an attached
    // document's own title heading on whichever later page it starts on —
    // useful because the cover letter's 附件 line is very often just
    // "如說明" with the real title never spelled out there at all.
    const pageTitleLines = [];
    for (let i = 0; i < canvases.length; i++) {
      record.statusDetail = `辨識第 ${i + 1}/${canvases.length} 頁`;
      renderTable();
      const { data } = await w.recognize(canvases[i]);
      let pageTitle = "";
      if (data.lines && data.lines.length) {
        const idx = findTitleLineIndex(data.lines, canvases[i].height);
        if (idx >= 0) pageTitle = data.lines[idx].text;
      }
      if (i === 0) titleLineRaw = pageTitle;
      pageTitleLines.push(pageTitle);
      if (i > 0) fullText += `\n${PAGE_BREAK}\n`;
      fullText += data.text + "\n";
    }
    record.titleLineRaw = titleLineRaw;
    record.pageTitleLines = pageTitleLines;
    record.ocrTextRaw = fullText.trim();
    record.ocrText = cleanOcrText(fullText).split(PAGE_BREAK).join("\n── 分頁 ──\n");
    record.meta = extractMetadata(record.ocrTextRaw, record.titleLineRaw, record.pageTitleLines);
    record.metaEdited = false; // an explicit re-OCR intentionally starts over from scratch
    record.ocrMethod = "local";
    record.status = "done";
    record.statusDetail = "";
  } catch (err) {
    console.error(err);
    record.status = "error";
    record.statusDetail = String(err && err.message ? err.message : err);
  }
  await dbPut(record);
  renderTable();
}

// --- Gemini 雲端 OCR（選用）--------------------------------------------------
// Unlike the local Tesseract path, Gemini is asked to return the structured
// fields directly — it's much better at handling messy/rotated scans and
// at understanding "this is a Taiwanese 公文" as a document type than a
// regex pass over raw OCR text ever will be, so there's no separate
// extractMetadata step here. The schema below mirrors the `meta` shape
// used everywhere else so the rest of the app doesn't need to know which
// pipeline produced a record.
const GEMINI_FIELD_SCHEMA = {
  type: "OBJECT",
  properties: {
    docType: { type: "STRING", description: "文別，只能是：令、呈、咨、函、公告、簽、書函、開會通知單、其他公文 其中之一" },
    agency: { type: "STRING", description: "發文機關全銜" },
    recipient: { type: "STRING", description: "受文者" },
    docNumber: { type: "STRING", description: "發文字號" },
    docDate: { type: "STRING", description: "發文日期，例如：中華民國115年3月28日" },
    speed: { type: "STRING", description: "速別" },
    security: { type: "STRING", description: "密等" },
    declassifyCondition: { type: "STRING", description: "解密條件或保密期限" },
    attachment: { type: "STRING", description: "附件名稱" },
    subject: { type: "STRING", description: "主旨／案由" },
    explanation: { type: "STRING", description: "說明" },
    proposal: { type: "STRING", description: "擬辦" },
    fullText: { type: "STRING", description: "每一頁的完整文字內容，依頁面順序串接，盡量逐字轉錄，用於全文搜尋" },
  },
  required: ["docType", "agency", "recipient", "docNumber", "docDate", "subject", "fullText"],
};
const GEMINI_PROMPT =
  "你會看到一份台灣政府公文的每一頁掃描影像（依頁面順序）。請依照指定的 JSON schema 擷取公文欄位。" +
  "文字一律用文件裡實際出現的繁體中文原文，查無該欄位就回傳空字串，不要自己編造內容。";

function canvasToBase64Png(canvas){
  return canvas.toDataURL("image/png").split(",")[1];
}

// 503（過載）跟 429（超過速率限制）都是 Google 自己說的「暫時性，等等再試」
// 錯誤，不是請求本身有問題 — 自動重試幾次再放棄，比丟給使用者手動重試省事。
const GEMINI_RETRY_STATUSES = new Set([503, 429]);
const GEMINI_RETRY_DELAYS_MS = [3000, 8000, 15000];

async function callGeminiOcr(canvases, apiKey, model, onRetry){
  const parts = [{ text: GEMINI_PROMPT }];
  for (const canvas of canvases) {
    parts.push({ inlineData: { mimeType: "image/png", data: canvasToBase64Png(canvas) } });
  }
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(apiKey)}`;
  const body = JSON.stringify({
    contents: [{ parts }],
    generationConfig: { responseMimeType: "application/json", responseSchema: GEMINI_FIELD_SCHEMA },
  });

  let lastErrorText = "";
  for (let attempt = 0; attempt <= GEMINI_RETRY_DELAYS_MS.length; attempt++) {
    const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body });
    if (res.ok) {
      const data = await res.json();
      const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
      if (!text) throw new Error("Gemini 沒有回傳可用的內容，請確認 API Key 與模型名稱是否正確。");
      return JSON.parse(text);
    }
    const respBody = await res.text().catch(() => "");
    lastErrorText = `Gemini API 錯誤（${res.status}）：${respBody.slice(0, 200) || res.statusText}`;
    const delay = GEMINI_RETRY_DELAYS_MS[attempt];
    if (!GEMINI_RETRY_STATUSES.has(res.status) || delay === undefined) throw new Error(lastErrorText);
    if (onRetry) onRetry(attempt + 1, GEMINI_RETRY_DELAYS_MS.length + 1, res.status, delay);
    await new Promise(r => setTimeout(r, delay));
  }
  throw new Error(lastErrorText);
}

async function runGeminiPipeline(record, fileBlob, apiKey, model){
  try {
    const buf = await fileBlob.arrayBuffer();
    const canvases = await renderPdfPages(buf);
    record.pageCount = canvases.length;
    record.statusDetail = "傳送到 Gemini 辨識中…";
    renderTable();
    const fields = await callGeminiOcr(canvases, apiKey, model, (attempt, total, status, delayMs) => {
      record.statusDetail = `Gemini ${status === 429 ? "超過速率限制" : "忙線中"}，${Math.round(delayMs / 1000)} 秒後重試（第 ${attempt}/${total} 次）…`;
      renderTable();
    });
    const fullText = (fields.fullText || "").trim();
    record.ocrTextRaw = fullText;
    record.ocrText = fullText;
    record.titleLineRaw = "";
    record.pageTitleLines = [];
    record.meta = {
      docType: fields.docType || "", agency: fields.agency || "", docNumber: fields.docNumber || "",
      docDate: fields.docDate || "", speed: fields.speed || "", security: fields.security || "",
      declassifyCondition: fields.declassifyCondition || "", attachment: fields.attachment || "",
      recipient: fields.recipient || "", subject: fields.subject || "",
      explanation: fields.explanation || "", proposal: fields.proposal || "",
    };
    record.metaEdited = false;
    record.ocrMethod = "gemini";
    record.status = "done";
    record.statusDetail = "";
  } catch (err) {
    console.error(err);
    record.status = "error";
    record.statusDetail = String(err && err.message ? err.message : err);
  }
  await dbPut(record);
  renderTable();
}

// --- Gemini API key / model（存在這台瀏覽器的 localStorage，不隨檔案走）----
function getStoredGeminiKey(){

}
function setStoredGeminiKey(v){

    if (v) localStorage.setItem("govDocOcrGeminiKey", v);
    else localStorage.removeItem("govDocOcrGeminiKey");
  } catch (e) {}
}
const DEFAULT_GEMINI_MODEL = "gemini-3.8-flash";
// Models Google has since cut off for new API keys — a value saved here
// before the retirement would otherwise keep silently 404ing forever.
const RETIRED_GEMINI_MODELS = new Set(["gemini-2.5-pro", "gemini-2.5-flash", "gemini-2.5-flash-lite", "gemini-2.0-flash"]);
function getStoredGeminiModel(){

    const v = localStorage.getItem("govDocOcrGeminiModel");
    return (v && !RETIRED_GEMINI_MODELS.has(v)) ? v : DEFAULT_GEMINI_MODEL;
  } catch (e) { return DEFAULT_GEMINI_MODEL; }
}
function setStoredGeminiModel(v){

}

async function processFile(file, mode, geminiApiKey, geminiModel){
  const id = (crypto.randomUUID && crypto.randomUUID()) || (Date.now() + "-" + Math.random());
  const record = {
    id, filename: file.name, uploadedAt: new Date().toISOString(),
    fileBlob: file, status: "processing", statusDetail: "準備中…",
    pageCount: 0, ocrText: "", meta: {}, ocrMethod: mode,
  };
  records.unshift(record);
  await dbPut(record);
  renderTable();
  if (mode === "gemini") await runGeminiPipeline(record, file, geminiApiKey, geminiModel);
  else await runOcrPipeline(record, file);
}

function escapeHtml(s){
  return (s || "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

// 發文日期 comes out of OCR as free text like "中華民國115年3月28日";
// render it as the compact ROC-calendar YYY/MM/DD form the list uses.
function toHalfWidthDigits(s){
  return (s || "").replace(/[０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0));
}
function formatRocDate(raw){
  if (!raw) return "";
  const m = toHalfWidthDigits(raw).match(/(\d{1,3})\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})\s*日?/);
  if (!m) return raw;
  return `${m[1].padStart(3, "0")}/${m[2].padStart(2, "0")}/${m[3].padStart(2, "0")}`;
}
// Same parse as formatRocDate, but as a real Date (ROC year + 1911) so the
// 發文日期 filter can compare against the Gregorian-calendar <input type=date>.
function parseRocDateToDate(raw){
  if (!raw) return null;
  const m = toHalfWidthDigits(raw).match(/(\d{1,3})\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})\s*日?/);
  if (!m) return null;
  const d = new Date(parseInt(m[1], 10) + 1911, parseInt(m[2], 10) - 1, parseInt(m[3], 10));
  return isNaN(d.getTime()) ? null : d;
}

// --- filters (關鍵字 / 發文者 / 收文者 / 日期區間) --------------------------
const selectedAgencies = new Set();
const selectedRecipients = new Set();

// --- 日期欄位排序（近到遠 / 遠到近） ----------------------------------------
// null = 維持預設順序（上傳時間新到舊）；"desc" = 日期近到遠；"asc" = 日期遠到近。
// 沒有可解析日期的紀錄一律排在最後，不論排序方向。
let dateSortDir = null;
function applyDateSort(list){
  if (!dateSortDir) return list;
  const withDate = [];
  const withoutDate = [];
  for (const r of list) {
    const d = parseRocDateToDate(r.meta.docDate);
    if (d) withDate.push([r, d]); else withoutDate.push(r);
  }
  withDate.sort((a, b) => dateSortDir === "desc" ? b[1] - a[1] : a[1] - b[1]);
  return withDate.map(([r]) => r).concat(withoutDate);
}

function matchesFilter(r, q, agencySet, recipientSet, dateFrom, dateTo){
  if (agencySet.size && !(r.meta.agency && agencySet.has(r.meta.agency))) return false;
  if (recipientSet.size && !(r.meta.recipient && recipientSet.has(r.meta.recipient))) return false;
  if (dateFrom || dateTo) {
    const d = parseRocDateToDate(r.meta.docDate);
    if (!d) return false;
    if (dateFrom && d < dateFrom) return false;
    if (dateTo && d > dateTo) return false;
  }
  if (!q) return true;
  const hay = [r.filename, r.meta.docNumber, r.meta.docDate, r.meta.subject, r.meta.agency, r.ocrText]
    .join(" ").toLowerCase();
  return hay.includes(q.toLowerCase());
}

function getActiveFilters(){
  const q = document.getElementById("searchBox").value.trim();
  const fromVal = document.getElementById("dateFromInput").value;
  const toVal = document.getElementById("dateToInput").value;
  const dateFrom = fromVal ? new Date(fromVal + "T00:00:00") : null;
  const dateTo = toVal ? new Date(toVal + "T23:59:59") : null;
  return { q, dateFrom, dateTo };
}

function populateMultiSelect(panelId, btnId, field, selectedSet, labelBase){
  const panel = document.getElementById(panelId);
  const values = Array.from(new Set(
    records.filter(r => r.status === "done" && r.meta[field]).map(r => r.meta[field].trim())
  )).sort((a, b) => a.localeCompare(b, "zh-Hant"));

  // The search box lives outside the re-rendered list so typing in it (and
  // its focus) survives the table re-render every checkbox click triggers.
  let search = panel.querySelector(".ms-search");
  let list = panel.querySelector(".ms-list");
  if (!search) {
    panel.innerHTML = `<input type="text" class="ms-search" data-ms-search="${field}" placeholder="搜尋單位…" autocomplete="off"><div class="ms-list"></div>`;
    search = panel.querySelector(".ms-search");
    list = panel.querySelector(".ms-list");
  }
  const q = search.value.trim().toLowerCase();
  const matched = q ? values.filter(v => v.toLowerCase().includes(q)) : values;

  list.innerHTML = !values.length
    ? `<div class="empty-hint">目前沒有可篩選的選項</div>`
    : `<div class="ms-actions"><button type="button" data-ms-all="${field}">${q ? "全選符合項目" : "全選"}</button><button type="button" data-ms-clear="${field}">清除</button></div>`
      + (matched.length
        ? matched.map(v => `
        <label><input type="checkbox" data-ms-field="${field}" value="${escapeHtml(v)}" ${selectedSet.has(v) ? "checked" : ""}> ${escapeHtml(v)}</label>
      `).join("")
        : `<div class="empty-hint">沒有符合的單位</div>`);

  const btn = document.getElementById(btnId);
  btn.innerHTML = `<span>${selectedSet.size ? `${labelBase}（已選 ${selectedSet.size}）` : labelBase}</span>`
    + `<svg class="chevron" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2.5 4.5L6 8L9.5 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  btn.classList.toggle("has-selection", selectedSet.size > 0);
}

// --- 表格勾選 / bulk action -------------------------------------------------
const selectedIds = new Set();

// The header checkbox reflects only the currently visible (filtered) rows —
// selecting "all" while a filter is active shouldn't silently also select
// rows the user can't currently see.
function updateBulkActionBar(visibleIds){
  const selectAllCb = document.getElementById("selectAllCheckbox");
  const visibleSelectedCount = [...visibleIds].filter(id => selectedIds.has(id)).length;
  selectAllCb.checked = visibleIds.size > 0 && visibleSelectedCount === visibleIds.size;
  selectAllCb.indeterminate = visibleSelectedCount > 0 && visibleSelectedCount < visibleIds.size;

  const hasSelection = selectedIds.size > 0;
  document.getElementById("bulkActionBar").classList.toggle("slot-hidden", !hasSelection);
  document.getElementById("filtersRow").classList.toggle("slot-hidden", hasSelection);
  document.getElementById("bulkCount").textContent = `已選取 ${selectedIds.size} 筆`;
}

// Always rendered (even with no filters) so the line has a stable height and
// the table doesn't jump when a filter turns on; it says what the rows
// below are actually a result of.
function renderFilterSummary(q, dateFrom, dateTo, visibleCount){
  const chips = [];
  if (q) chips.push(`關鍵字：${q}`);
  if (selectedAgencies.size) chips.push(`發文者：${[...selectedAgencies].join("、")}`);
  if (selectedRecipients.size) chips.push(`收文者：${[...selectedRecipients].join("、")}`);
  if (dateFrom || dateTo) {
    const fmt = d => d.toLocaleDateString("sv-SE");
    chips.push(`日期：${dateFrom ? fmt(dateFrom) : "不限"} ～ ${dateTo ? fmt(dateTo) : "不限"}`);
  }
  const el = document.getElementById("filterSummary");
  el.innerHTML = (chips.length
    ? `<span>目前篩選：</span>` + chips.map(c => `<span class="fs-chip" title="${escapeHtml(c)}">${escapeHtml(c)}</span>`).join("")
      + `<span class="fs-count">符合 ${visibleCount} / ${records.length} 筆</span>`
    : `<span>目前顯示：全部公文</span><span class="fs-count">共 ${records.length} 筆</span>`);
}

function renderTable(){
  const tbody = document.getElementById("tbody");
  const { q, dateFrom, dateTo } = getActiveFilters();
  const visible = applyDateSort(records.filter(r => matchesFilter(r, q, selectedAgencies, selectedRecipients, dateFrom, dateTo)));
  populateMultiSelect("agencyFilterPanel", "agencyFilterBtn", "agency", selectedAgencies, "篩選發文者");
  populateMultiSelect("recipientFilterPanel", "recipientFilterBtn", "recipient", selectedRecipients, "篩選收文者");

  // A record can leave the list entirely (deleted) — drop it from the
  // selection too, or a stale id would inflate the bulk-action count forever.
  const visibleIds = new Set(visible.map(r => r.id));
  const liveIds = new Set(records.map(r => r.id));
  for (const id of selectedIds) if (!liveIds.has(id)) selectedIds.delete(id);

  document.getElementById("totalCount").textContent = records.length;
  renderFilterSummary(q, dateFrom, dateTo, visible.length);
  document.getElementById("emptyState").style.display = records.length === 0 ? "block" : "none";
  document.getElementById("docTable").style.display = records.length === 0 ? "none" : "table";

  updateBulkActionBar(visibleIds);

  if (records.length > 0 && visible.length === 0) {
    tbody.innerHTML = `<tr><td colspan="7" class="empty-state">沒有符合篩選條件的文件</td></tr>`;
    return;
  }

  tbody.innerHTML = visible.map(r => {
    const isDone = r.status === "done";
    let tagsHtml;
    if (isDone) {
      tagsHtml = (r.meta.docType ? `<span class="chip tone-unknown">${escapeHtml(r.meta.docType)}</span>` : "")
        + `<span class="chip tone-${r.ocrMethod === "gemini" ? "gemini" : "local"}">${OCR_METHOD_ICON[r.ocrMethod === "gemini" ? "gemini" : "local"]}${r.ocrMethod === "gemini" ? "Gemini" : "本機"}</span>`
        + (r.metaEdited ? `<span class="muted" style="font-size:.72rem">內容已手動校正</span>` : "");
    } else if (r.status === "error") {
      tagsHtml = `<span class="chip tone-error">辨識失敗</span>`;
    } else {
      tagsHtml = `<span class="chip tone-processing">${escapeHtml(r.statusDetail || "處理中")}</span>`;
    }
    const subjectText = isDone
      ? (escapeHtml(r.meta.subject) || '<span class="muted">—</span>')
      : `<span class="muted">${escapeHtml(r.filename)}</span>`;
    return `
    <tr data-id="${r.id}" class="${selectedIds.has(r.id) ? "row-selected" : ""}">
      <td class="checkbox-cell" data-label="選取"><input type="checkbox" class="row-checkbox" data-select-id="${r.id}" ${selectedIds.has(r.id) ? "checked" : ""}></td>
      <td data-label="主旨" class="subtitle-cell">
        <div class="clamp">${subjectText}</div>
        <div class="row-tags">${tagsHtml}</div>
      </td>
      <td data-label="發文者">${escapeHtml(r.meta.agency) || '<span class="muted">—</span>'}</td>
      <td data-label="收文者">${escapeHtml(r.meta.recipient) || '<span class="muted">—</span>'}</td>
      <td data-label="日期">${escapeHtml(formatRocDate(r.meta.docDate)) || '<span class="muted">—</span>'}</td>
      <td data-label="密等">${escapeHtml(r.meta.security) || '<span class="muted">—</span>'}</td>
      <td data-label="操作"><div class="actions">
        <button class="act" data-action="view" ${!isDone ? "disabled" : ""}>詳細內容</button>
        <span class="icon-actions">
          <button class="icon-btn danger" data-action="delete" title="刪除" aria-label="刪除">
            <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 6H16M8 6V4.5C8 4 8.4 3.5 9 3.5H11C11.6 3.5 12 4 12 4.5V6M14.5 6L14 16C14 16.6 13.5 17 13 17H7C6.5 17 6 16.6 6 16L5.5 6H14.5Z" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>

  }).join("");
}

// 主旨/發文字號/發文日期等欄位整理成一份 Markdown，方便帶著走或貼到別處
// 引用；OCR 全文另外用程式碼區塊包起來，避免內容裡的 # 或 * 被誤判成格式語法。
function recordToMarkdown(r){
  const m = r.meta || {};
  const lines = [`# ${m.subject || r.filename}`, ""];
  const fields = [
    ["檔案名稱", r.filename], ["文別", m.docType], ["發文者", m.agency], ["受文者", m.recipient],
    ["發文字號", m.docNumber], ["發文日期", m.docDate], ["速別", m.speed], ["密等", m.security],
    ["解密條件", m.declassifyCondition], ["附件", m.attachment],
  ];
  for (const [label, value] of fields) if (value) lines.push(`- **${label}**：${value}`);
  if (m.explanation) lines.push("", "## 說明", "", m.explanation);
  if (m.proposal) lines.push("", "## 擬辦", "", m.proposal);
  if (r.ocrText) lines.push("", "## 全文 OCR 內容", "", "```", r.ocrText, "```");
  return lines.join("\n");
}

function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

// 一份公文一個 .md 檔；只有一筆就直接下載該檔，多筆則先打包成 zip 再下載，
// 避免瀏覽器一次觸發多個下載被擋掉，也方便使用者整批帶走。
async function exportMarkdown(targets, btn){
  if (!targets.length) return;
  if (targets.length === 1) {
    const blob = new Blob([recordToMarkdown(targets[0])], { type: "text/markdown;charset=utf-8" });
    downloadBlob(blob, `${targets[0].filename.replace(/\.pdf$/i, "")}.md`);
    return;
  }
  const originalLabel = btn.textContent;
  btn.disabled = true;
  btn.textContent = "打包中…";
  try {
    const zip = new JSZip();
    const usedNames = new Set();
    for (const r of targets) {
      let base = r.filename.replace(/\.pdf$/i, "") || r.id;
      let name = `${base}.md`;
      let n = 2;
      while (usedNames.has(name)) { name = `${base}_${n}.md`; n++; }
      usedNames.add(name);
      zip.file(name, recordToMarkdown(r));
    }
    const zipBlob = await zip.generateAsync({ type: "blob" });
    const stamp = new Date().toISOString().slice(0, 10);
    downloadBlob(zipBlob, `公文匯出_${stamp}_${targets.length}筆.zip`);
  } finally {
    btn.disabled = false;
    btn.textContent = originalLabel;
  }
}

function wireMultiSelect(wrapId, panelId, btnId, field, selectedSet){

    } else if (e.target.matches(`[data-ms-clear="${field}"]`)) {
      selectedSet.clear();
      renderTable();
    }
  });
  wrap.dataset.wired = "1";
}

const dropzone = document.getElementById("dropzone");

// OCR is CPU/memory heavy and the Tesseract worker is a single shared
// instance, so files are processed one at a time even when several are
// dropped together — running them concurrently was racing worker setup
// and stalling every job.
const pendingQueue = [];
let queueBusy = false;
function enqueueTask(taskFn){
  pendingQueue.push(taskFn);
  runQueue();
}
async function runQueue(){
  if (queueBusy) return;
  queueBusy = true;
  while (pendingQueue.length) {
    const task = pendingQueue.shift();
    await task();
  }
  queueBusy = false;
  // All queued uploads/re-OCR jobs are done — if the import dialog is open,
  // there's nothing left for the user to wait on, so close it for them.
  const importOverlay = document.getElementById("importOverlay");
  if (importOverlay.classList.contains("show")) importOverlay.classList.remove("show");
}

function handleFiles(fileList){
  const files = Array.from(fileList).filter(f => f.type === "application/pdf" || f.name.toLowerCase().endsWith(".pdf"));
  if (files.length === 0) { alert("請選擇 PDF 檔案"); return; }

  // Block by filename — both against what's already in the list and
  // against duplicates within this same drop/selection batch.
  const seenNames = new Set(records.map(r => r.filename));
  const accepted = [];
  const skipped = [];
  for (const f of files) {
    if (seenNames.has(f.name)) {
      skipped.push(f.name);
    } else {
      accepted.push(f);
      seenNames.add(f.name);
    }
  }
  if (skipped.length) {
    alert(`以下檔案的檔名已存在於清單中，已略過，未重複上傳：\n${skipped.join("\n")}`);
  }
  if (!accepted.length) return;

  const mode = currentOcrMode();
  let apiKey = "", model = "";
  if (mode === "gemini") {
    apiKey = geminiApiKeyInput.value.trim();
    model = currentGeminiModel() || DEFAULT_GEMINI_MODEL;
    if (!apiKey) { alert("請先輸入 Gemini API Key 才能用 AI 雲端辨識。"); return; }
    if (!model) { alert("請輸入自訂模型名稱。"); return; }
    setStoredGeminiKey(apiKey);
    setStoredGeminiModel(model);
  }
  accepted.forEach(f => enqueueTask(() => processFile(f, mode, apiKey, model)));
}

  try {
    records = await dbGetAll();
    records.sort((a, b) => new Date(b.uploadedAt) - new Date(a.uploadedAt));

    // Metadata extraction rules improve over time; the raw OCR text is kept
    // per record specifically so already-processed documents can be
    // re-parsed with the latest rules on load, without re-running OCR.
    // Gemini records skip this — their meta came straight from the model's
    // structured output, not from the regex-based extractMetadata() pass,
    // so re-running that heuristic over Gemini's transcribed text would
    // silently replace a better answer with a worse one.
    const reparsed = [];
    for (const r of records) {
      if (r.status === "done" && r.ocrTextRaw && !r.metaEdited && r.ocrMethod !== "gemini") {
        const freshMeta = extractMetadata(r.ocrTextRaw, r.titleLineRaw, r.pageTitleLines);
        if (JSON.stringify(freshMeta) !== JSON.stringify(r.meta)) {
          r.meta = freshMeta;
          reparsed.push(r);
        }
      }
    }
    if (reparsed.length) {
      await Promise.all(reparsed.map(r => dbPut(r)));
    }
  } catch (e) { console.warn("IndexedDB unavailable", e); }
  renderTable();
})();
</script>
</body>
</html>
